version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zkdata:/var/lib/zookeeper/data
      - zkdatalog:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      LOG_DIR: /tmp
      KAFKA_LOG4J_OPTS: "-Dlog4j.configuration=file:/etc/kafka/log4j.properties"
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash", "/init-topics.sh"]
    restart: "on-failure"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibanadata:/usr/share/kibana/data
    restart: unless-stopped

  logstash:
    build: ./logstash
    depends_on:
      - kafka
      - kafka-init
      - elasticsearch
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m -XX:ActiveProcessorCount=2
      - POLL_INTERVAL=10
      - GRIDFREQ_URL=https://dat.netzfrequenzmessung.de:9080
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    command: ["logstash", "-f", "/usr/share/logstash/pipeline/logstash.conf", "-w", "2", "-b", "200"]
    restart: unless-stopped

  spark-alerts:
    build: ./spark
    depends_on:
      - kafka
      - kafka-init
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_IN=frequency.telemetry
      - TOPIC_OUT=frequency.spark-alerts
      - WARN_HZ=0.02
      - CRIT_HZ=0.05
      - CHECKPOINT_DIR=/data/chk/frequency_spark_alerts
      - STARTING_OFFSETS=latest
    volumes:
      - ./spark:/app:ro
      - ./data:/data
    command: ["spark-submit",
              "--packages","org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
              "/app/frequency_spark_alerts.py"]
    restart: unless-stopped

  spark-parquet:
    build: ./spark
    depends_on:
      - kafka
      - kafka-init
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_IN=frequency.telemetry
      - PARQUET_PATH=/data/telemetry_parquet/frequency
      - CHECKPOINT_DIR=/data/chk/frequency_to_parquet
      - STARTING_OFFSETS=latest
    volumes:
      - ./spark:/app:ro
      - ./data:/data
    command: ["spark-submit",
              "--packages","org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
              "/app/frequency_to_parquet.py"]
    restart: unless-stopped

  spark-ml-inference:
    build: ./spark
    depends_on:
      - kafka
      - kafka-init
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_IN=frequency.telemetry
      - TOPIC_OUT=frequency.ml-alerts
      - MODEL_PATH=/data/models/frequency_anomaly_clf
      - PROB_WARN=0.60
      - PROB_CRIT=0.85
      - CHECKPOINT_DIR=/data/chk/frequency_ml_inference
      - STARTING_OFFSETS=latest
    volumes:
      - ./spark:/app:ro
      - ./data:/data
    command: ["spark-submit",
              "--packages","org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
              "/app/frequency_ml_inference.py"]
    restart: unless-stopped

  ml-indexer:
    image: python:3.11-slim
    depends_on:
      - kafka
      - kafka-init
      - elasticsearch
    working_dir: /app
    environment:
      - KAFKA_BOOTSTRAP=kafka:29092
      - TOPIC_IN=frequency.ml-alerts
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX=frequency-ml-alerts

      - KAFKA_GROUP_ID=frequency-ml-indexer-live-1
      - KAFKA_AUTO_OFFSET_RESET=latest

      - PRINT_EVERY=20
    volumes:
      - ./ml_indexer.py:/app/ml_indexer.py:ro
    command:
      [
        "bash","-lc",
        "pip install --no-cache-dir kafka-python==2.3.0 elasticsearch==8.12.1 && python /app/ml_indexer.py"
      ]
    restart: unless-stopped

volumes:
  esdata:
  kibanadata:
  kafkadata:
  zkdata:
  zkdatalog:
