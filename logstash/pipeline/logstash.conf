input {
  exec {
    command  => "/usr/share/logstash/pipeline/fetch_gridfreq.sh"
    interval => 10
    codec    => plain
  }
}

filter {
  mutate {
    add_field => {
      "event_type" => "grid_frequency"
      "grid"       => "continental_europe"
      "source"     => "netzfrequenzmessung"
    }
  }

  mutate { add_field => { "ingest_ts" => "%{@timestamp}" } }

  if ![message] or [message] == "" or [message] == "__CURL_FAIL__" or [message] =~ /^__CURL_FAIL__/ {
    mutate {
      add_tag => ["fetch_fail"]
      add_field => { "dlq_reason" => "fetch_fail" }
    }
  } else {

    ruby {
      code => '
        msg = event.get("message")
        if msg
          msg = msg.gsub(/<f<f_(\d+)>/, "<f_\\1>")
          event.set("message", msg)
        end
      '
    }

    mutate { replace => { "[event][original]" => "%{message}" } }

    xml {
      source      => "message"
      store_xml   => false
      force_array => false
      xpath => [
        "/r/z/text()",  "z",
        "/r/p/text()",  "phase_deg",
        "/r/dt/text()", "dt",
        "/r/n/text()",  "n",
        "/r/d/text()",  "d",
        "/r/f0/text()", "f0",
        "/r/f1/text()", "f1",
        "/r/f2/text()", "f2"
      ]
    }

    if "_xmlparsefailure" in [tags] {
      mutate {
        add_tag => ["parse_fail"]
        add_field => { "dlq_reason" => "xml_parse_fail" }
      }
    } else {

      mutate {
        convert => {
          "f0"        => "float"
          "f1"        => "float"
          "f2"        => "float"
          "phase_deg" => "float"
        }
      }

      ruby {
        code => '
          v = event.get("dt")
          v = v[0] if v.is_a?(Array)
          if v
            s = v.to_s.tr(",", ".")
            event.set("dt", s.to_f)
          end
        '
      }

      ruby {
        code => '
          msg = event.get("message") || ""

          m = msg.match(/<f_(\d+)>\s*([0-9]+(?:\.[0-9]+)?)\s*<\/f_\1>/)
          if m
            event.set("f_dyn_code", m[1])
            event.set("f_dyn", m[2].to_f)
          end

          f = event.get("f_dyn")
          f = event.get("f2") if f.nil? || f.to_s.empty?
          f = event.get("f1") if f.nil? || f.to_s.empty?
          f = event.get("f0") if f.nil? || f.to_s.empty?

          if f.nil? || f.to_s.empty?
            event.tag("missing_frequency")
            event.set("dlq_reason", "missing_frequency")
          else
            f = f.to_f
            event.set("frequency_hz", f)
            dev = f - 50.0
            event.set("deviation_hz", dev)
            event.set("abs_deviation_mhz", dev.abs * 1000.0)  # mHz
          end
        '
      }

      if [z] and [z] != "" {
        mutate { add_field => { "source_ts_raw" => "%{z}" } }

        date {
          match    => ["z", "dd.MM.yyyy HH:mm:ss"]
          timezone => "UTC"
          target   => "@timestamp"
        }
      }

      mutate { remove_field => ["command", "host"] }

      if !("missing_frequency" in [tags]) {
        ruby {
          code => '
            t = LogStash::Event.new(
              "@timestamp" => event.get("@timestamp"),
              "ingest_ts"  => event.get("ingest_ts"),
              "source_ts_raw" => event.get("source_ts_raw"),

              "stream"     => "telemetry",
              "event_type" => event.get("event_type"),
              "grid"       => event.get("grid"),
              "source"     => event.get("source"),
              "n"          => event.get("n"),
              "d"          => event.get("d"),
              "phase_deg"  => event.get("phase_deg"),
              "dt"         => event.get("dt"),
              "frequency_hz"      => event.get("frequency_hz"),
              "deviation_hz"      => event.get("deviation_hz"),
              "abs_deviation_mhz" => event.get("abs_deviation_mhz")
            )
            new_event_block.call(t)
          '
        }
      }
    }
  }
}

output {
  if [stream] == "telemetry" {
    kafka {
      bootstrap_servers => "kafka:29092"
      topic_id          => "frequency.telemetry"
      codec             => json { ecs_compatibility => disabled }
      acks              => "1"
      compression_type  => "lz4"
    }
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "frequency-telemetry"
    }

  } else if "fetch_fail" in [tags] or "parse_fail" in [tags] or "missing_frequency" in [tags] {
    kafka {
      bootstrap_servers => "kafka:29092"
      topic_id          => "frequency.dlq"
      codec             => json { ecs_compatibility => disabled }
      acks              => "1"
      compression_type  => "lz4"
    }
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "frequency-dlq"
    }

  } else {
    kafka {
      bootstrap_servers => "kafka:29092"
      topic_id          => "frequency.raw"
      codec             => json { ecs_compatibility => disabled }
      acks              => "1"
      compression_type  => "lz4"
    }
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "frequency-raw"
    }
  }
}
